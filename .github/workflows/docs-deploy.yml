name: Docs

# Build + EXECUTE the docs site and deploy it to https://nltools.org on every push
# to master, on every `v*` release tag (same trigger as release.yml), and on a
# manual run. The site tracks master deliberately — docs run ahead of the PyPI
# release so the merged API can be dogfooded (e.g. a GitHub install) and patched
# before `poe release`. Executing every tutorial through a real Jupyter kernel is
# also a test layer: a notebook that fails to run fails the build before deploy.
#
# nltools.org is a custom domain served from the site root, so BASE_URL stays
# unset here and the docs-site task's SITE_URL default (https://nltools.org) is the
# sitemap/robots host. A fork deploying to a project page sets BASE_URL=/<repo>
# and SITE_URL=https://<user>.github.io/<repo>.
on:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:

# Pages source must be "GitHub Actions" (Settings -> Pages -> Build and deployment),
# not the legacy gh-pages branch — actions/deploy-pages publishes the uploaded
# artifact directly. The custom domain + HTTPS settings are independent of this.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; never cancel an in-flight deploy under a newer push.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      UV_PYTHON: "3.12"

    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          version: "0.7.6"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: "22"

      # mystmd is an npm package (not a Python dep); poe docs-build shells out to
      # `myst`, so it must be on PATH. Pinned to match local dev (v1.10.1).
      - name: Install MyST
        run: npm install -g mystmd@1.10.1

      - name: Install dependencies
        run: uv sync --extra all

      # Tutorials fetch example data from the Hugging Face hub; cache it across runs.
      - name: Cache HF niftis dataset
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: ~/.cache/huggingface
          key: hf-cache-${{ runner.os }}-${{ hashFiles('nltools/templates/fetch.py') }}
          restore-keys: |
            hf-cache-${{ runner.os }}-

      # Regenerate sources (API reference, tutorial .md), then build + EXECUTE the
      # MyST site. A fresh checkout is already cold (no MyST execute cache, no
      # tutorial joblib caches); docs-build-fresh makes that explicit so a local
      # `uv run poe docs-build-fresh` reproduces exactly this build, including the
      # tutorial stderr gate. Root deploy: BASE_URL intentionally unset.
      - name: Build + execute docs
        env:
          HF_HUB_ETAG_TIMEOUT: "30"
        run: uv run poe docs-build-fresh

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: docs/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5.0.0
