# Zensical site configuration. Build: `uv run poe docs-build`. Preview: `uv run poe docs-serve`.

[project]
site_name = "nltools"
site_description = "A Python package to analyze neuroimaging data"
site_url = "https://nltools.org/"
docs_dir = "docs"
site_dir = "site"
repo_url = "https://github.com/cosanlab/nltools"
extra_css = ["_static/custom.css"]

nav = [
  { "Home" = "index.md" },
  { "Migrating from v0.5" = "migration-guide.md" },
  # Each tutorial page is generated from its marimo notebook by
  # scripts/marimo_to_zensical.py and executes its cells while the site builds.
  # The remaining notebooks under docs/tutorials/ are parked and join the nav one
  # at a time; a notebook in this nav must also be in that script's
  # TUTORIAL_GLOBS, and nowhere else.
  { "Tutorials" = [
    "tutorials/index.md",
    { "Data operations" = [
      "tutorials/data-operations/01_brain_data.md",
    ] },
  ] },
  # One page per user-facing namespace, rendered by mkdocstrings from docs/api/.
  # The User Guide pages are parked under docs-staging/.
  { "Reference" = [
    { "nltools" = "api/nltools.md" },
    { "nltools.data" = [
      "api/data/brain_data.md",
      "api/data/adjacency.md",
      "api/data/design_matrix.md",
      "api/data/roc.md",
      "api/data/simulator.md",
      "api/data/results.md",
    ] },
    { "nltools.algorithms" = "api/algorithms.md" },
    { "nltools.io" = "api/io.md" },
    { "nltools.datasets" = "api/datasets.md" },
    { "nltools.mask" = "api/mask.md" },
    { "nltools.cross_validation" = "api/cross_validation.md" },
    { "nltools.plotting" = "api/plotting.md" },
    { "nltools.utils" = "api/utils.md" },
  ] },
  { "Development" = [
    "contributing.md",
    "changelog.md",
  ] },
]

# A broken internal link or a link to a heading that does not exist fails
# `zensical build --strict`.
[project.validation]
invalid_links = true
invalid_link_anchors = true

# markdown-exec runs the `python exec="on"` fence on the home page, which reads
# the installed package version. Restricted to Python so an ordinary ```bash or
# ```md fence on any other page keeps going through the normal highlighter.
[project.plugins.markdown-exec]
languages = ["python"]

# mkdocstrings renders every page under docs/api/ from the `:::` directives on
# those pages. Options here are the project-wide defaults; a page overrides them
# in its own `options:` block.
[project.plugins.mkdocstrings]
default_handler = "python"

[project.plugins.mkdocstrings.handlers.python]
paths = ["."]
# Types from these projects are cross-referenced by their public URL. The polars
# inventory carries method entries only (`polars.DataFrame.join`), not the bare
# `polars.DataFrame` / `Series` / `Expr` classes, so those still render as text.
inventories = [
  "https://docs.python.org/3/objects.inv",
  "https://numpy.org/doc/stable/objects.inv",
  "https://docs.pola.rs/api/python/stable/objects.inv",
  "https://nilearn.github.io/stable/objects.inv",
  "https://scikit-learn.org/stable/objects.inv",
]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
docstring_options = { ignore_init_summary = true, returns_multiple_items = false, returns_named_value = false }
docstring_section_style = "table"
filters = ["!^_"]
group_by_category = true
heading_level = 1
members_order = "alphabetical"
merge_init_into_class = true
separate_signature = true
show_category_heading = true
show_docstring_examples = true
show_docstring_raises = true
show_if_no_docstring = false
show_object_full_path = false
show_root_full_path = false
show_root_heading = true
show_root_members_full_path = false
show_signature_annotations = true
show_submodules = false
# mkdocstrings' `summary = true` also emits a Modules table, which griffe2md's
# did not: it listed submodules that have no page of their own.
summary = { attributes = true, functions = true, classes = true, modules = false }
# Not offered by griffe2md, and chosen here: signature types link to the page
# documenting them (the postprocessor used to rewrite those links by hand), and
# the source listings stay off so a page reads as a reference, not a listing.
signature_crossrefs = true
show_source = false

[project.theme]
variant = "modern"
features = [
  "content.code.copy",
  "navigation.sections",
  "navigation.top",
  "search.suggest",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.snippets = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
