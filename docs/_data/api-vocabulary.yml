# Canonical v0.6.0 kwarg vocabulary — SINGLE SOURCE OF TRUTH.
#
# This file is the machine-readable source for the canonical-kwarg vocabulary. It
# feeds TWO consumers, both wired into `poe lint-api`:
#
#   1. Docs rendering — `scripts/build_api_vocabulary.py` injects rendered tables into
#      docs/development/index.md (2-column prose table) and docs/public/design-tour.html
#      (3-column table + "exceptions" callout) between `<!-- AUTOGEN:api-vocabulary -->`
#      marker pairs. Edit HERE, then `uv run poe docs-generate` to propagate; the
#      `--check` mode fails CI if the committed tables have drifted.
#   2. Code enforcement — `scripts/check_api_vocabulary.py` walks every public `def`
#      in nltools/ with `ast` and validates signatures against the `enforcement:`
#      section below: banned alias kwargs and per-kwarg semantic contracts (e.g.
#      `metric=` may never default to a central tendency — that concept is `summary=`).
#
# This file IS the canon: CLAUDE.md's "API Conventions" section, the rendered docs
# tables, and the enforcement scripts all point here. There is no second copy to
# keep in sync — edit the vocabulary/rules here and regenerate.
#
# Per-row fields:
#   concept    — the concept the kwarg names (shared by both tables).
#   kwarg      — the bare canonical name; the design-tour "Canonical kwarg" cell
#                renders it as <code>{kwarg}</code>.
#   tour_note  — the design-tour "Notes" cell, written in Markdown. Inline
#                `code` spans and *emphasis* are converted to HTML; `·` chips are
#                literal. Used only by the design tour.
#   index_md   — the index.md "Canonical kwarg" cell, written as raw Markdown
#                (e.g. a `code` span, possibly with a value set or qualifier).
#                Table pipes are escaped automatically at render time — author
#                them as plain `|`.

stats:
  data_classes: 4
  algorithm_families: 3
  compute_backends: 2

vocabulary:
  - concept: "Algorithm / variant choice"
    kwarg: "method"
    tour_note: "not `algorithm`/`scheme`/`kind`/`estimator`"
    index_md: "`method`"
  - concept: "Spatial scale"
    kwarg: "spatial_scale"
    tour_note: "`'whole_brain'` · `'roi'` · `'searchlight'`"
    index_md: "`spatial_scale` (`'whole_brain' | 'roi' | 'searchlight'`)"
  - concept: "Distance / similarity metric"
    kwarg: "metric"
    tour_note: "kept separate from `method`"
    index_md: "`metric`"
  - concept: "Central tendency"
    kwarg: "summary"
    tour_note: "`'mean'` · `'median'` — never `metric`"
    index_md: "`summary` (`'mean' | 'median'`)"
  - concept: "Subject-level parallelism"
    kwarg: "n_jobs"
    tour_note: "default `-1`"
    index_md: "`n_jobs: int = -1`"
  - concept: "GPU / CPU selection"
    kwarg: "device"
    tour_note: "orthogonal to `n_jobs`"
    index_md: "`device: str = \"cpu\"`"
  - concept: "Backend (ridge/alignment internals)"
    kwarg: "parallel"
    tour_note: "`None` · `'cpu'` · `'gpu'` — inference uses `device`"
    index_md: "`parallel: None | 'cpu' | 'gpu'` (the inference engine uses `device` as of v0.6.0)"
  - concept: "Progress indicator"
    kwarg: "progress_bar"
    tour_note: "`verbose` reserved for log-level"
    index_md: "`progress_bar: bool = False`"
  - concept: "Permutation count"
    kwarg: "n_permute"
    tour_note: "distinct from…"
    index_md: "`n_permute`"
  - concept: "Bootstrap sample count"
    kwarg: "n_samples"
    tour_note: "…the bootstrap count"
    index_md: "`n_samples`"
  - concept: "Threshold pair"
    kwarg: "lower, upper, binarize"
    tour_note: "convenience `threshold` where bidirectional"
    index_md: "`lower`, `upper`, `binarize` (+ `threshold` where bidirectional)"
  - concept: "Diagonal flag"
    kwarg: "include_diag"
    tour_note: "not `ignore_diagonal` — inverted sense"
    index_md: "`include_diag: bool`"
  - concept: "Radius (mm)"
    kwarg: "radius_mm"
    tour_note: "units in the name"
    index_md: "`radius_mm: float`"

# Deliberate deviations from the table (design-tour "exceptions" callout).
# Each entry names the function + kwarg it exempts (the checker suppresses that
# exact pair) and carries `text`, the Markdown → HTML sentence the design tour
# renders. Keep in sync with CLAUDE.md exceptions F175/F105/F077.
exceptions:
  - function: "BrainData.fit"
    kwarg: "model"
    finding: F175
    text: "`fit(model='glm'|'ridge')` selects an estimator *class*, not a variant."
  - function: "Ridge.__init__"
    kwarg: "n_iter"
    finding: F105
    text: "`Ridge(n_iter=)` matches sklearn's random-search name."
  - function: "Glm.compute_contrasts"
    kwarg: "statistic"
    finding: F077
    text: "`compute_contrasts(statistic=)` selects an output map (t/z/p/β), not an algorithm."

# ── Machine-checkable enforcement rules (scripts/check_api_vocabulary.py) ─────
#
# Scope model mirrors .semgrep/rules.yml: rules bind PUBLIC (non-underscore)
# defs; the ridge/alignment/pipelines subsystems keep legacy names because the
# facades translate at their boundary (CLAUDE.md "Facade translation" rule).
#
#   banned_kwargs   — alias → {canonical, exclude_paths?}: the alias may not
#                     appear as a parameter name on any public def in scope.
#   kwarg_contracts — canonical kwarg → constraints checked when the kwarg
#                     appears WITH a literal default: `banned_defaults` (values
#                     that signal the wrong concept), `allowed_defaults` (the
#                     closed set of legal defaults), `keyword_only: true`.
#   exemptions      — extra (function, kwarg) suppressions beyond `exceptions:`
#                     above (which the checker also honors). Each needs a reason.
enforcement:
  exclude_paths:
    - "nltools/tests/"
    - "nltools/algorithms/ridge/"
    - "nltools/algorithms/alignment/"
    - "nltools/pipelines/"
  banned_kwargs:
    algorithm: {canonical: "method"}
    scheme: {canonical: "method"}
    kind: {canonical: "method"}
    estimator: {canonical: "method"}
    icc_type: {canonical: "method"}
    extract_type: {canonical: "method"}
    perm_type: {canonical: "method"}
    contrast_type: {canonical: "method"}
    mode: {canonical: "method"}
    parallel:
      canonical: "n_jobs (CPU workers) or device (cpu/gpu selection)"
      # resolve_backend() is the boundary translator from the ridge/alignment
      # layers' `parallel=` vocabulary to a Backend — its param IS the concept.
      exclude_paths: ["nltools/algorithms/backends.py"]
    backend:
      canonical: "device"
      # Home of the Backend abstraction itself — its `backend=` params ARE the concept.
      exclude_paths: ["nltools/algorithms/backends.py"]
    n_perm: {canonical: "n_permute"}
    n_iter: {canonical: "n_permute (permutations) or n_samples (bootstrap)"}
    show_progress: {canonical: "progress_bar"}
    ignore_diagonal: {canonical: "include_diag (note the inverted sense)"}
  kwarg_contracts:
    metric:
      banned_defaults: ["mean", "median"]
      hint: "a 'mean'/'median' default means this is a central tendency — name it summary=; metric= is reserved for distance/similarity metrics"
    summary:
      allowed_defaults: ["mean", "median"]
      hint: "summary= is the 'mean'|'median' central-tendency choice; other concepts need another name (e.g. cluster_summary's within/between choice is scope=)"
    progress_bar:
      allowed_defaults: [false]
      keyword_only: true
      hint: "canonical form is `*, progress_bar: bool = False`"
    n_jobs:
      allowed_defaults: [-1]
      hint: "canonical form is `n_jobs: int = -1` (all cores)"
    device:
      allowed_defaults: ["cpu", "auto"]
      hint: "canonical form is `device: str = 'cpu'` ('auto' where supported)"
      # Backend's own methods use `device=None` to mean "the backend's device".
      exclude_paths: ["nltools/algorithms/backends.py"]
    spatial_scale:
      # `null` covers the SpatialScale *metadata* carrier on constructors
      # (e.g. `Adjacency(spatial_scale=None)`), a different concept from the
      # 'whole_brain'|'roi'|'searchlight' selector on analysis methods.
      allowed_defaults: ["whole_brain", "roi", "searchlight", null]
      hint: "spatial_scale selector values are 'whole_brain' | 'roi' | 'searchlight'"
  exemptions:
    # Migrated from `# nosemgrep: banned-kwarg-permutation-count` suppressions:
    # n_iter here is the LocalAlignment/SRM solver iteration count, matching the
    # estimator's own kwarg (same rationale as the Ridge n_iter exception F105) —
    # not a permutation count.
    - {function: "BrainCollection.align", kwarg: "n_iter", reason: "SRM/LocalAlignment solver iterations, matching the estimator's own name"}
    - {function: "align", kwarg: "n_iter", reason: "delegation target of BrainCollection.align (collection/inference.py)"}
    # BrainData.predict deliberately defaults n_jobs=1: searchlight at n_jobs=-1
    # duplicates the brain per worker (memory) and nests under collection-level
    # parallelism (see docs/development/execution-model.md and the docstring).
    - {function: "BrainData.predict", kwarg: "n_jobs", reason: "searchlight memory + nested-parallelism guard; documented in the docstring"}
    - {function: "predict", kwarg: "n_jobs", reason: "delegation target of BrainData.predict (braindata/prediction.py)"}
