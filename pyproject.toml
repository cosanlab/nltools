[project]
name = "nltools"
version = "0.6.0"
requires-python = ">=3.11"
description = "A Python package to analyze neuroimaging data"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name="Luke J. Chang", email="luke.j.chang@dartmouth.edu"},
    {name="Eshin Jolly", email="eshin.jolly@gmail.com"},
]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
]
keywords=["neuroimaging", "preprocessing", "analysis", "machine-learning"]
dependencies = [
    "anywidget>=0.9",
    # BrainCollection.fit() always writes HDF5 fit bundles
    # (data/collection/execution.py imports h5py unguarded), so h5py is
    # required for core functionality, not an optional add-on. hdf5plugin
    # stays in the `h5` extra: it only registers blosc/zstd/lz4 filters for
    # reading compressed legacy files, and nltools/io/h5.py already guards
    # that import with an actionable error.
    "h5py>=3.15",
    "huggingface-hub>=0.30",
    "joblib>=1.5.3",
    # >=0.14 for the non-deprecated `residuals_`/`predicted_`/`r_square_` GLM accessors.
    "nilearn>=0.14",
    "numpy>=2.0.2",
    # >=1.42.1 for `pl.concat(how="horizontal_extend")`.
    "polars>=1.42.1",
    "pynv>=0.3",
    # Imported directly throughout (cross_validation, ridge, MDS, ...); >=1.8 for
    # the current MDS kwargs (metric='precomputed', metric_mds, init).
    "scikit-learn>=1.8",
    "seaborn>=0.13.2",
]

[project.optional-dependencies]
# h5py is a core dependency (see above); kept listed here so `nltools[h5]`
# keeps resolving for anyone who already pins it.
h5 = ["h5py>=3.15", "hdf5plugin>=6.0.0"]
graph = ["networkx>=3.5"]
interactive_plots = ["ipywidgets>=8.1.7"]
all = ["nltools[h5,graph,interactive_plots]"]

# Installed by default when using uv install
[dependency-groups]
dev = [
    "git-cliff>=2.0",
    "griffe2md>=1.3.0",
    "h5py>=3.15",
    "hdf5plugin>=6.0.0",
    "ipywidgets>=8.1.7",
    "jupyter-book>=2.1.4",
    "jupytext>=1.18.1",
    "marimo>=0.23",
    "mystmd>=1.10.1",
    "networkx>=3.5",
    "poethepoet>=0.40.0",
    "pytest>=8.4",
    "pytest-xdist>=3.8.0",
    "pyyaml>=6.0",
    "rich>=14.2.0",
    "ruff==0.14.2",
    "semgrep>=1.100",
    "torch>=2.9.0",
    "tqdm>=4.67.1",
    "ty>=0.0.4",
]

[project.urls]
Homepage = "https://nltools.org"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nltools"]
# Niftis (templates + parcellations) are fetched lazily from
# huggingface.co/datasets/nltools/niftis on first use, never vendored.
exclude = [
  "nltools/tests",
  "nltools/tests/**",
  "nltools/resources/niftis/**",
  "**/.DS_Store",
]

[tool.hatch.build.targets.sdist]
include = [
  "nltools/**",
  "README.md",
  "LICENSE",
  "pyproject.toml",
]
exclude = [
  "nltools/resources/niftis/**",
  "nltools/tests/data/**",
  "**/.DS_Store",
]

[tool.ruff]
exclude = ["*.ipynb"]

[tool.ruff.lint]
extend-select = ["UP", "C4", "PIE", "RUF022", "RET", "SIM"]
ignore = [
    "W292", "E501", "E731", "E741",
    "RET504",  # named intermediate vars document math intent
    # SIM judgment calls — readability tradeoffs, not style wins:
    "SIM102",  # nested-if collapse can erase step-by-step validation
    "SIM103",  # `return bool(x)` sometimes less explicit than if/return
    "SIM105",  # contextlib.suppress conflicts with NaN-sentinel patterns
    "SIM108",  # ternary forcing (multi-line init often clearer)
    "SIM114",  # if-with-same-arms may be intentional parallel structure
    "SIM116",  # dict-lookup dispatch can hurt readability
    "SIM910",  # bikeshed (explicit None default is fine)
]

[tool.pytest.ini_options]
markers = [
    "slow: Tests taking >3s (skipped by default)",
    "integration: End-to-end pipelines on real data (skipped by default)",
    "gpu: Tests requiring CUDA/GPU hardware",
]
# Only collect the package suite; benchmarks/ carries its own scripts + smoke tests.
testpaths = ["nltools/tests"]
# Default: fast unit tests only. Skip slow + integration for iteration speed.
# Run slow tests:        pytest -m slow
# Run integration tests: pytest -m integration
# Run everything:        pytest -m ""
addopts = "-m 'not slow and not integration'"

[tool.ty.src]
# Only check our code, not third-party
include = ["nltools/"]
exclude = ["nltools/tests/"]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.rules]
# --- Ignore: ty limitations or third-party stub gaps ---
unresolved-import = "ignore"           # Optional deps (cupy, bids, torch)
unresolved-attribute = "ignore"        # nibabel FileBasedImage stubs missing .affine/.shape/.get_fdata
possibly-missing-attribute = "ignore"  # Same family — unions with None on third-party types
no-matching-overload = "ignore"        # numpy/matplotlib overload resolution failures
parameter-already-assigned = "ignore"  # *args forwarding (MDS, sklearn) confuses ty

# --- Ignore: too noisy, mostly third-party type mismatches ---
unsupported-operator = "ignore"          # Operators on Optional types from third-party unions
not-subscriptable = "ignore"             # Indexing Optional without narrowing (third-party)
invalid-argument-type = "ignore"         # Dominated by numpy/nibabel/sklearn stub gaps
invalid-assignment = "ignore"            # Mixed real and third-party
too-many-positional-arguments = "ignore" # seaborn deprecated positional args

# --- Error: these catch real bugs ---
# invalid-return-type = "error"        # (default)
# division-by-zero = "error"           # (default)
# call-non-callable = "error"          # (default)
# not-iterable = "error"               # (default)

[tool.poe.tasks.ok]
help = "Run the project gate: lint, format, types, API conventions, and tests"
sequence = [
    { cmd = "ruff check nltools/" },
    { cmd = "ruff format --check nltools/" },
    { cmd = "ty check nltools/" },
    { ref = "lint-api" },
    { ref = "test" },
]

[tool.poe.tasks.lint]
help = "Fix, format, and type-check (ruff check --fix -> ruff format -> ty check)"
shell = """ruff check nltools --fix && ruff format nltools && ty check nltools"""

[tool.poe.tasks.lint-api]
help = "Enforce public API conventions (vocabulary manifest checker + semgrep rules + keyword-only `*` marker check + docs vocab drift check + docs/api drift check)"
shell = """python scripts/check_api_vocabulary.py && semgrep scan --config .semgrep/rules.yml --error --metrics off nltools/ && python scripts/check_kwonly.py && python scripts/build_api_vocabulary.py --check && python scripts/build_api_docs.py --check && python scripts/check_docstrings.py"""

[tool.poe.tasks.test]
help = "Run default fast test suite (parallel)"
cmd = "pytest -n auto --maxprocesses=4"

[tool.poe.tasks.test-all]
help = "Run all tests including slow and integration"
cmd = "pytest -m '' -n auto --maxprocesses=4"

[tool.poe.tasks.test-braindata]
help = "Test BrainData class"
cmd = "pytest nltools/tests/data/braindata -n auto --maxprocesses=4 -x"

[tool.poe.tasks.test-adjacency]
help = "Test Adjacency class"
cmd = "pytest nltools/tests/data/adjacency nltools/tests/plotting/test_adjacency.py -n auto --maxprocesses=4 -x"

[tool.poe.tasks.test-designmatrix]
help = "Test DesignMatrix class"
cmd = "pytest nltools/tests/data/designmatrix -n auto --maxprocesses=4 -x"

[tool.poe.tasks.test-collection]
help = "Test BrainCollection class"
cmd = "pytest nltools/tests/data/collection -n auto --maxprocesses=4 -x"

[tool.poe.tasks.test-algorithms]
help = "Test consolidated algorithms modules (corrections/outliers/signal/similarity/regression/intersubject/procrustes)"
cmd = "pytest nltools/tests/core/test_algorithms -n auto --maxprocesses=4 -x"

[tool.poe.tasks.test-core]
help = "Test core algorithms"
cmd = "pytest nltools/tests/core -n auto --maxprocesses=4 -x"

[tool.poe.tasks.test-models]
help = "Test models (GLM, ridge, base)"
cmd = "pytest nltools/tests/models -n auto --maxprocesses=4 -x"

[tool.poe.tasks.test-io]
help = "Test IO (file reader, h5)"
cmd = "pytest nltools/tests/io_tests -n auto --maxprocesses=4 -x"

[tool.poe.tasks.test-plotting]
help = "Test plotting"
cmd = "pytest nltools/tests/plotting -n auto --maxprocesses=4 -x"

[tool.poe.tasks.test-support]
help = "Test support utilities"
cmd = "pytest nltools/tests/support -n auto --maxprocesses=4 -x"

[tool.poe.tasks.docs-clean]
help = "Clean built docs (preserves execute cache so unchanged cells don't re-run)"
shell = """cd docs && myst clean --site --html --temp --logs --cache --exports --templates -y"""

[tool.poe.tasks.docs-clean-cache]
help = "Clear MyST execute cache to force re-running all code cells on next build"
shell = """cd docs && myst clean --execute -y"""

[tool.poe.tasks.docs-generate]
help = "Generate API docs (griffe2md) and tutorial markdown (marimo → MyST-NB) from source"
shell = """
set -eu
python scripts/build_api_docs.py --clean
python scripts/build_api_vocabulary.py
python scripts/marimo_to_myst.py --all
"""

# Build + EXECUTE the MyST site: runs every tutorial code-cell through a Jupyter
# kernel to bake outputs (figures, prints). Leave BASE_URL unset for a root build
# (local, and the nltools.org deploy); set it (e.g. /nltools) only for a subpath
# deploy such as a fork's GitHub Pages project page.
[tool.poe.tasks.docs-site]
help = "Build the MyST site, executing tutorials (via the execute cache) to bake outputs; fails on a raising cell (--strict) or any cell stderr (BASE_URL=/<repo> only for a subpath deploy; SITE_URL overrides the https://nltools.org sitemap host)"
shell = """
set -eu
# MyST executes tutorial code-cells through a Jupyter kernel named `python3` (see
# each page's kernelspec). Register it into the active venv so a fresh env (CI, a
# new clone) can execute — idempotent, and a no-op harm if already present.
python -m ipykernel install --sys-prefix --name python3 --display-name 'Python 3' >/dev/null 2>&1 || true
cd docs
# The kernel must not inherit a developer's ~/.ipython profile (e.g.
# ast_node_interactivity='all' prints every bare expression and duplicates
# figures); an empty IPYTHONDIR keeps executed outputs identical to CI.
mkdir -p _build/ipython
export IPYTHONDIR="$PWD/_build/ipython"
# --strict exits non-zero on build *errors* (warnings are only summarized): a
# tutorial cell that raises is a file error, so it fails the build instead of
# silently truncating the page.
myst build --site --html --execute --strict
# Standalone interactive Design Tour page (not a MyST page; copied verbatim).
cp public/design-tour.html _build/html/design-tour.html
# MyST does not apply BASE_URL to the literal `url:` Design Tour TOC link. On a
# subpath deploy, prefix it. The (?<![\\w-]) guard keeps it idempotent.
if [ -n "${BASE_URL:-}" ]; then
  find _build/html -type f \\( -name '*.html' -o -name '*.json' \\) -exec perl -pi -e 's{(?<![\\w-])/design-tour\\.html}{$ENV{BASE_URL}/design-tour.html}g' {} +
fi
# The static build stamps its localhost dev-server host into sitemap.xml, robots.txt
# and each page's site metadata (myst.yml `domains:` can't hold an apex domain).
# Rewrite it to the public origin so search engines index the deployed URLs.
export SITE_URL="${SITE_URL:-https://nltools.org}"
find _build/html -type f \\( -name '*.html' -o -name '*.json' -o -name '*.xml' -o -name '*.txt' \\) -exec perl -pi -e 's{http://localhost:3000}{$ENV{SITE_URL}}g' {} +
# stderr gate (issue #489): myst.yml's `output_stderr: remove-warn` strips stderr
# from the rendered pages, so inspect the raw kernel outputs in the execute cache
# and fail if any tutorial cell warned.
python ../scripts/check_tutorial_stderr.py --docs-dir .
"""

[tool.poe.tasks.docs-build]
help = "Full docs build: regenerate sources → build + execute the site (root build; BASE_URL=/<repo> only for a subpath deploy)"
sequence = [
  { ref = "docs-generate" },
  { ref = "docs-site" },
]

# What CI runs (docs-deploy.yml). A fresh checkout has neither cache, so this is
# a no-op there; locally it guarantees every tutorial cell really re-executes and
# every joblib-cached fit really recomputes before the stderr gate judges them.
[tool.poe.tasks.docs-build-fresh]
help = "Cold docs build, as CI runs it: drop the tutorials' joblib caches and the MyST execute cache, then docs-build"
sequence = [
  { ref = "tutorials-clean-cache" },
  { ref = "docs-clean-cache" },
  { ref = "docs-build" },
]

[tool.poe.tasks.docs-preview]
help = "Live preview the MyST site with executed tutorial outputs (reuses the execute cache; only changed cells re-run)"
shell = """cd docs && mkdir -p _build/ipython && IPYTHONDIR="$PWD/_build/ipython" myst start --execute"""

[tool.poe.tasks.tutorials-check]
help = "Lint tutorial marimo notebooks (static checks, no execution)"
shell = """for nb in docs/tutorials/basics/[0-9]*.py docs/tutorials/workflows/[0-9]*.py; do echo "check $nb"; marimo check "$nb" || exit 1; done"""

[tool.poe.tasks.tutorials-run]
help = "Execute each tutorial marimo notebook as a script to verify it runs end-to-end"
shell = """for nb in docs/tutorials/basics/[0-9]*.py docs/tutorials/workflows/[0-9]*.py; do echo "run  $nb"; python "$nb" || exit 1; done"""

[tool.poe.tasks.tutorials-clean-cache]
help = "Clear the tutorials' joblib fit caches (forces recompute). Memory('.cache/tutorials') is cwd-relative: repo root for `poe tutorials-run`, and docs/tutorials/<section>/ for the MyST build, whose kernels run with cwd = the page's directory"
shell = """rm -rf .cache/tutorials docs/.cache/tutorials docs/tutorials/*/.cache"""

[tool.poe.tasks.tutorials]
help = "Static-check tutorial notebooks, then verify they run end-to-end"
sequence = [
  { ref = "tutorials-check" },
  { ref = "tutorials-run" },
]

[tool.poe.tasks.changelog]
help = "Regenerate docs/changelog.md from git history via git-cliff"
shell = "git-cliff --output docs/changelog.md"

[tool.poe.tasks.release]
help = "Full release: bump version, build, smoke-test, changelog, tag, publish"
cmd = "python scripts/release.py --target ${target}"
args = [
    { name = "target", options = ["--target"], choices = ["pypi", "testpypi"], default = "pypi" },
]

[tool.griffe2md]
docstring_style = "google"
# One page per module (scripts/build_api_docs.py lists them): recursing into
# submodules duplicated every member on the package page and pushed headings
# past h6.
show_submodules = false
# The root heading must be on for the class template to emit the constructor
# signature fence. It is rendered at h1 (heading_level below) so members keep
# their h2/h3 levels, and the postprocess strips it — the build script's
# frontmatter title stands in for it.
show_root_heading = true
# Undocumented members (dataclass fields, module constants) rendered as empty
# table rows; document a member to publish it.
show_if_no_docstring = false
# A Returns block is one `type: description` value (Google style) whose
# description may span several lines — not one named item per line, which split
# multi-line descriptions into separate rows and put the type in a Name column.
docstring_options = { ignore_init_summary = true, returns_multiple_items = false, returns_named_value = false }
show_docstring_examples = true
show_signature_annotations = true
separate_signature = true
merge_init_into_class = true
group_by_category = true
show_category_heading = true
members_order = "alphabetical"
heading_level = 1
filters = ["!^_"]
docstring_section_style = "table"
summary = true
show_docstring_raises = true
show_root_full_path = false
show_root_members_full_path = false
show_object_full_path = false
