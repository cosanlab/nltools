[project]
name = "nltools"
version = "0.6.0.dev0"
requires-python = ">=3.11"
description = "A Python package to analyze neuroimaging data"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name="Luke J. Chang", email="luke.j.chang@dartmouth.edu"},
    {name="Eshin Jolly", email="eshin.jolly@gmail.com"},
]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
]
keywords=["neuroimaging", "preprocessing", "analysis", "machine-learning"]
dependencies = [
    "anywidget>=0.9",
    # Shared BrainData, DesignMatrix, and Adjacency HDF5 persistence. >=3.13 is
    # the h5py that Pyodide 314 bundles, and h5py is compiled, so nothing newer
    # can resolve in the browser; every API nltools calls (File, create_dataset,
    # create_group, attrs, string_dtype, check_string_dtype, Dataset.asstr) has
    # been there since 3.0.
    "h5py>=3.13",
    "himalaya>=0.4.11,<0.5",
    "huggingface-hub>=0.30",
    "joblib>=1.5.3",
    # Imported directly for plotting (not only reached through nilearn[plotting]);
    # >=3.8.0 matches nilearn's own plotting-extra floor, above every matplotlib
    # API nltools calls (figure/subplots/pyplot basics).
    "matplotlib>=3.8.0",
    # Imported directly throughout (BrainData, mask, atlases, simulator, ...);
    # >=5.2.0 matches nilearn's floor, above every nibabel API nltools calls
    # (Nifti1Image, load, save, affines, FileHolder).
    "nibabel>=5.2.0",
    # >=0.14 for the non-deprecated `residuals_`/`predicted_`/`r_square_` GLM accessors.
    "nilearn>=0.14.1",
    "numpy>=2.0.2",
    # Imported directly throughout (designmatrix, mask, plotting, ...); >=2.3.0
    # matches nilearn's floor, above every pandas API nltools calls (DataFrame,
    # Series, pd.NA, pd.api.types.is_numeric_dtype).
    "pandas>=2.3.0",
    # >=1.33.1 is the polars that Pyodide 314 bundles, so the browser build
    # resolves; `nltools.utils._HORIZONTAL_CONCAT` picks the horizontal-concat
    # method name that the installed polars accepts across that range.
    "polars>=1.33.1",
    "pynv>=0.3",
    # Imported directly throughout (cross_validation, ridge, MDS, ...); >=1.8 for
    # the current MDS kwargs (metric='precomputed', metric_mds, init).
    "scikit-learn>=1.8",
    # Imported directly throughout (algorithms, adjacency, roc, ...); >=1.11.1
    # matches nilearn's floor, above the newest scipy API nltools calls
    # (stats.binomtest, added in scipy 1.7.0).
    "scipy>=1.11.1",
    "seaborn>=0.13.2",
    # Used by _maybe_tqdm/_make_progress_bar (nltools.utils) on the progress_bar=True
    # path; version matches the existing dev-group pin.
    "tqdm>=4.67.1",
]

[project.optional-dependencies]
# h5py is a core dependency (see above); the extra is kept as an alias so
# `pip install nltools[h5]` — what the missing-h5py error tells users to run —
# keeps resolving for anyone who already pins it.
h5 = ["h5py>=3.13"]
graph = ["networkx>=3.5"]
interactive_plots = ["ipywidgets>=8.1.7"]
all = ["nltools[h5,graph,interactive_plots]"]

# Installed by default when using uv install
[dependency-groups]
dev = [
    "git-cliff>=2.0",
    "h5py>=3.13",
    "ipywidgets>=8.1.7",
    "marimo>=0.23",
    "markdown-exec>=1.12.3",
    "mkdocstrings-python>=2.0.8",
    "networkx>=3.5",
    "poethepoet>=0.40.0",
    "pytest>=8.4",
    "pytest-xdist>=3.8.0",
    "pyyaml>=6.0",
    "rich>=14.2.0",
    "ruff==0.14.2",
    "semgrep>=1.100",
    "torch>=2.9.0",
    "tqdm>=4.67.1",
    "ty>=0.0.4",
    "zensical>=0.0.60",
]

[project.urls]
Homepage = "https://nltools.org"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nltools"]
# Niftis (templates + parcellations) are fetched lazily from
# huggingface.co/datasets/nltools/niftis on first use, never vendored.
exclude = [
  "nltools/tests",
  "nltools/tests/**",
  "nltools/resources/niftis/**",
  "**/.DS_Store",
]

[tool.hatch.build.targets.sdist]
include = [
  "nltools/**",
  "README.md",
  "LICENSE",
  "pyproject.toml",
]
exclude = [
  "nltools/resources/niftis/**",
  "nltools/tests/data/**",
  "**/.DS_Store",
]

[tool.ruff]
exclude = ["*.ipynb"]

[tool.ruff.lint]
extend-select = ["UP", "C4", "PIE", "RUF022", "RET", "SIM"]
ignore = [
    "W292", "E501", "E731", "E741",
    "RET504",  # named intermediate vars document math intent
    # SIM judgment calls — readability tradeoffs, not style wins:
    "SIM102",  # nested-if collapse can erase step-by-step validation
    "SIM103",  # `return bool(x)` sometimes less explicit than if/return
    "SIM105",  # contextlib.suppress conflicts with NaN-sentinel patterns
    "SIM108",  # ternary forcing (multi-line init often clearer)
    "SIM114",  # if-with-same-arms may be intentional parallel structure
    "SIM116",  # dict-lookup dispatch can hurt readability
    "SIM910",  # bikeshed (explicit None default is fine)
]

[tool.pytest.ini_options]
markers = [
    "slow: Tests taking >3s (skipped by default)",
    "integration: End-to-end pipelines on real data (skipped by default)",
    "gpu: Tests requiring CUDA/GPU hardware",
]
testpaths = ["nltools/tests"]
# Default: fast unit tests only. Skip slow + integration for iteration speed.
# Run slow tests:        pytest -m slow
# Run integration tests: pytest -m integration
# Run everything:        pytest -m ""
addopts = "-m 'not slow and not integration'"

[tool.ty.src]
# Only check our code, not third-party
include = ["nltools/"]
exclude = ["nltools/tests/"]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.rules]
# --- Ignore: ty limitations or third-party stub gaps ---
unresolved-import = "ignore"           # Optional deps (cupy, bids, torch)
unresolved-attribute = "ignore"        # nibabel FileBasedImage stubs missing .affine/.shape/.get_fdata
possibly-missing-attribute = "ignore"  # Same family — unions with None on third-party types
no-matching-overload = "ignore"        # numpy/matplotlib overload resolution failures
parameter-already-assigned = "ignore"  # *args forwarding (MDS, sklearn) confuses ty

# --- Ignore: too noisy, mostly third-party type mismatches ---
unsupported-operator = "ignore"          # Operators on Optional types from third-party unions
not-subscriptable = "ignore"             # Indexing Optional without narrowing (third-party)
invalid-argument-type = "ignore"         # Dominated by numpy/nibabel/sklearn stub gaps
invalid-assignment = "ignore"            # Mixed real and third-party
too-many-positional-arguments = "ignore" # seaborn deprecated positional args

# --- Error: these catch real bugs ---
# invalid-return-type = "error"        # (default)
# division-by-zero = "error"           # (default)
# call-non-callable = "error"          # (default)
# not-iterable = "error"               # (default)

[tool.poe.tasks.ok]
help = "Run the project gate: lint, format, types, API conventions, and tests"
sequence = [
    { cmd = "ruff check nltools/" },
    { cmd = "ruff format --check nltools/" },
    { cmd = "ty check nltools/" },
    { ref = "lint-api" },
    { ref = "test" },
]

[tool.poe.tasks.lint]
help = "Fix, format, and type-check (ruff check --fix -> ruff format -> ty check)"
shell = """ruff check nltools --fix && ruff format nltools && ty check nltools"""

[tool.poe.tasks.lint-api]
help = "Enforce public API conventions (vocabulary manifest checker + semgrep rules + keyword-only `*` marker check + docs vocab drift check)"
shell = """python scripts/check_api_vocabulary.py && semgrep scan --config .semgrep/rules.yml --error --metrics off nltools/ && python scripts/check_kwonly.py && python scripts/build_api_vocabulary.py --check"""

[tool.poe.tasks.test]
help = "Run default fast test suite (parallel)"
cmd = "pytest -n auto --maxprocesses=4"

[tool.poe.tasks.test-all]
help = "Run all tests including slow and integration"
cmd = "pytest -m '' -n auto --maxprocesses=4"

[tool.poe.tasks.test-braindata]
help = "Test BrainData class"
cmd = "pytest nltools/tests/data/braindata -n auto --maxprocesses=4 -x"

[tool.poe.tasks.test-adjacency]
help = "Test Adjacency class"
cmd = "pytest nltools/tests/data/adjacency nltools/tests/plotting/test_adjacency.py -n auto --maxprocesses=4 -x"

[tool.poe.tasks.test-designmatrix]
help = "Test DesignMatrix class"
cmd = "pytest nltools/tests/data/designmatrix -n auto --maxprocesses=4 -x"

[tool.poe.tasks.test-algorithms]
help = "Test consolidated algorithms modules (corrections/outliers/signal/similarity/regression/intersubject/procrustes)"
cmd = "pytest nltools/tests/core/test_algorithms -n auto --maxprocesses=4 -x"

[tool.poe.tasks.test-core]
help = "Test core algorithms"
cmd = "pytest nltools/tests/core -n auto --maxprocesses=4 -x"

[tool.poe.tasks.test-models]
help = "Test models (GLM, ridge, base)"
cmd = "pytest nltools/tests/models -n auto --maxprocesses=4 -x"

[tool.poe.tasks.test-io]
help = "Test IO (file reader, h5)"
cmd = "pytest nltools/tests/io_tests -n auto --maxprocesses=4 -x"

[tool.poe.tasks.test-plotting]
help = "Test plotting"
cmd = "pytest nltools/tests/plotting -n auto --maxprocesses=4 -x"

[tool.poe.tasks.test-support]
help = "Test the designation guard and the shared utils"
cmd = "pytest nltools/tests/support nltools/tests/utils -n auto --maxprocesses=4 -x"

[tool.poe.tasks.test-datasets]
help = "Test dataset fetchers, brainspace templates and atlases"
cmd = "pytest nltools/tests/datasets nltools/tests/templates nltools/tests/data/atlases -n auto --maxprocesses=4 -x"

# Deliberately outside `ok` and CI: it needs node, the network, and a couple of
# minutes. Run it by hand when a dependency floor or the browser fetch path
# changes.
[tool.poe.tasks.test-pyodide]
help = "Build the wheel and run the Pyodide/WASM smoke tests (requires node and network)"
shell = "uv build --wheel && cd nltools/tests/pyodide && npm install --silent && node test_runner.mjs"

# Leaves `.tutorial-cache/` alone: that holds the tutorials' joblib fits, which
# `tutorials-clean-cache` (and `docs-build-fresh`) drop deliberately.
[tool.poe.tasks.docs-clean]
help = "Remove the built site (site/), zensical's page cache (.cache/), the generated tutorial pages and the build leftovers under docs/"
sequence = [
  { shell = """
set -eu
rm -r site 2>/dev/null || true
rm -r .cache 2>/dev/null || true
rm docs/tutorials/*/[0-9]*_*.md 2>/dev/null || true
""" },
  { ref = "docs-prune" },
]

# The tutorial pages are out of the site until #503 restores them one at a time,
# so nothing here converts the marimo notebooks. Restoring a tutorial means
# adding its `marimo_to_zensical.py` run back here and its page to the nav.
[tool.poe.tasks.docs-generate]
help = "Generate the API vocabulary tables from docs/_data/api-vocabulary.yml"
shell = """
set -eu
python scripts/build_api_vocabulary.py
"""

# Zensical builds every file under `docs_dir` into the site and offers no way to
# exclude one, so whatever else lands there ships with the site: marimo's editor
# session state under `docs/tutorials/*/__marimo__` is several MB of cached
# notebook outputs.
[tool.poe.tasks.docs-prune]
help = "Drop the build leftovers under docs/ that zensical would otherwise copy into the site"
shell = """
set -eu
rm -r docs/tutorials/*/__marimo__ 2>/dev/null || true
"""

# Build the site. No page executes anything heavier than the home page's version
# fence, so this is seconds, not minutes; `-c` drops zensical's page cache, which
# is keyed on page content and so goes stale when the library changes.
[tool.poe.tasks.docs-build]
help = "Full docs build: regenerate sources → build the zensical site into site/ with strict link checking"
sequence = [
  { ref = "docs-generate" },
  { ref = "docs-prune" },
  { shell = """
set -eu
zensical build --strict -c
""" },
]

# The preview regenerates the sources first, then serves with live reload.
[tool.poe.tasks.docs-serve]
help = "Live preview the zensical site at http://localhost:8000: regenerate sources, then serve with live reload"
sequence = [
  { ref = "docs-generate" },
  { ref = "docs-prune" },
  { shell = """
set -eu
zensical serve
""" },
]

# What CI runs (docs-deploy.yml). With the tutorials out of the site this is just
# `docs-build`; it stays so the tutorials' fit caches are dropped again as soon as
# #503 puts a notebook back in the build.
[tool.poe.tasks.docs-build-fresh]
help = "Cold docs build, as CI runs it: drop the tutorials' fit caches and recorded outputs, then run the docs build"
sequence = [
  { ref = "tutorials-clean-cache" },
  { ref = "docs-build" },
]

[tool.poe.tasks.tutorials-check]
help = "Lint tutorial marimo notebooks (static checks, no execution)"
shell = """for nb in docs/tutorials/basics/[0-9]*.py docs/tutorials/data-operations/[0-9]*.py docs/tutorials/analysis/[0-9]*.py docs/tutorials/workflows/[0-9]*.py; do echo "check $nb"; marimo check "$nb" || exit 1; done"""

[tool.poe.tasks.tutorials-run]
help = "Execute each tutorial marimo notebook as a script to verify it runs end-to-end"
shell = """for nb in docs/tutorials/basics/[0-9]*.py docs/tutorials/data-operations/[0-9]*.py docs/tutorials/analysis/[0-9]*.py docs/tutorials/workflows/[0-9]*.py; do echo "run  $nb"; python "$nb" || exit 1; done"""

[tool.poe.tasks.tutorials-clean-cache]
help = "Clear .tutorial-cache/: the tutorials' joblib fit caches and their recorded page outputs (forces recompute). Memory('.tutorial-cache') is cwd-relative, and both `poe tutorials-run` and the docs build run from the repo root, so one cache serves both"
shell = """rm -r .tutorial-cache 2>/dev/null || true"""

[tool.poe.tasks.tutorials]
help = "Static-check tutorial notebooks, then verify they run end-to-end"
sequence = [
  { ref = "tutorials-check" },
  { ref = "tutorials-run" },
]

[tool.poe.tasks.changelog]
help = "Regenerate docs/changelog.md from git history via git-cliff"
shell = "git-cliff --output docs/changelog.md"

[tool.poe.tasks.release]
help = "Full release: bump version, build, smoke-test, changelog, tag, publish"
cmd = "python scripts/release.py --target ${target}"
args = [
    { name = "target", options = ["--target"], choices = ["pypi", "testpypi"], default = "pypi" },
]
