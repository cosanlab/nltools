name: CI

# Fast feedback on every push to / PR against master. Runs the default fast test
# suite (slow + integration markers are skipped by pyproject addopts). Manually
# triggerable via the Actions tab.
#
# Skip CI for a push by putting `[skip ci]` (or `[ci skip]`) in the head commit
# message (each job is guarded below). The token is bracketed so that merely
# mentioning "ci skip" in prose does not accidentally skip the run. PRs always
# run — the guard only reads the push head commit, absent on pull_request events.
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  lint:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '[ci skip]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          version: "0.7.6"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra all

      # Non-mutating mirror of `poe lint` (which runs ruff --fix + format
      # in-place). CI must fail on drift, not silently fix it.
      - name: Ruff lint
        run: uv run ruff check nltools/

      - name: Ruff format check
        run: uv run ruff format --check nltools/

      - name: Type-check with ty
        run: uv run ty check nltools/

      # v0.6.0 canonical-kwarg API conventions gate (semgrep rules + kw-only check).
      - name: API conventions
        run: uv run poe lint-api

  test:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '[ci skip]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          version: "0.7.6"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra all

      - name: Cache HF niftis dataset
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: ~/.cache/huggingface
          key: hf-cache-${{ runner.os }}-${{ hashFiles('nltools/templates/fetch.py') }}
          restore-keys: |
            hf-cache-${{ runner.os }}-

      - name: Run fast tests
        env:
          HF_HUB_ETAG_TIMEOUT: "30"
        run: uv run poe test

      # Smoke the site the deploy builds: `docs-build` regenerates the API
      # vocabulary tables and the tutorial pages, then runs
      # `zensical build --strict`, which fails on a broken internal link, a `:::`
      # directive naming something that does not exist, or a tutorial cell that
      # raises or writes to stderr. HF_TOKEN authenticates the template and atlas
      # downloads those cells trigger; unauthenticated calls print a rate-limit
      # warning to stderr, which fails the build. 3.12 leg only.
      - name: Build docs (zensical strict build)
        if: matrix.python-version == '3.12'
        env:
          HF_HUB_ETAG_TIMEOUT: "30"
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: uv run poe docs-build

      - name: Build package
        if: matrix.python-version == '3.12'
        run: uv build
