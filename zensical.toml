# Zensical site configuration. Build: `uv run poe docs-build`. Preview: `uv run poe docs-serve`.
#
# Transitional: the MyST toolchain (docs/myst.yml and the `docs-site` /
# `docs-preview` tasks) still builds the tutorial pages until the notebook
# rendering pipeline lands. Zensical reads every markdown file under `docs_dir`,
# so `docs-build` clears MyST's rendered output first.

[project]
site_name = "nltools"
site_description = "A Python package to analyze neuroimaging data"
site_url = "https://nltools.org/"
docs_dir = "docs"
site_dir = "site"
repo_url = "https://github.com/cosanlab/nltools"
extra_css = ["_static/custom.css"]

nav = [
  { "Home" = "index.md" },
  { "Migrating from v0.5" = "migration-guide.md" },
  { "Tutorials" = [
    { "Overview" = "tutorials/index.md" },
    { "Basics" = [
      "tutorials/basics/01-brain-data.md",
      "tutorials/basics/02-design-matrix.md",
      "tutorials/basics/03-adjacency.md",
    ] },
    { "Workflows" = [
      "tutorials/workflows/01-glm.md",
      "tutorials/workflows/02-encoding.md",
      "tutorials/workflows/03-mvpa.md",
      "tutorials/workflows/04-isc.md",
    ] },
  ] },
  # Hand-written task pages, one per task, mirroring "Functions by task" below.
  { "User Guide" = [
    { "Overview" = "guide/index.md" },
    "guide/loading.md",
    "guide/design-and-glm.md",
    "guide/prediction.md",
    "guide/similarity-and-rsa.md",
    "guide/alignment.md",
    "guide/statistics-and-inference.md",
    "guide/intersubject.md",
    "guide/plotting.md",
    "guide/atlases.md",
  ] },
  # Generated by scripts/build_api_docs.py from its PAGES registry (a test keeps
  # the two in sync). Task pages re-cut the public functions by what a user wants
  # to do; the per-module reference sits last, under Development.
  { "Reference" = [
    { "Data classes" = [
      "api/data/brain_data.md",
      "api/data/adjacency.md",
      "api/data/design_matrix.md",
      { "Prediction results" = "api/data/results.md" },
      "api/models.md",
    ] },
    { "Functions by task" = [
      "api/tasks/loading.md",
      "api/tasks/preprocessing.md",
      "api/tasks/design-and-glm.md",
      "api/tasks/prediction.md",
      "api/tasks/similarity.md",
      "api/tasks/alignment.md",
      "api/tasks/inference.md",
      "api/tasks/intersubject.md",
      "api/tasks/plotting.md",
      "api/tasks/atlases.md",
      "api/tasks/simulation.md",
    ] },
    { "nltools.algorithms (A–Z index)" = "api/algorithms.md" },
    { "Searchlight neighborhoods" = "api/neighborhoods.md" },
  ] },
  { "Development" = [
    "contributing.md",
    { "Architecture" = "development/index.md" },
    "development/ridge-internals.md",
    "development/inference-internals.md",
    "development/benchmarks.md",
    "development/execution-model.md",
    "development/release-verification.md",
    { "Design tour" = "public/design-tour.html" },
    { "Specifications" = [
      "development/specs/braindata.md",
      "development/specs/adjacency.md",
      "development/specs/designmatrix.md",
      "development/specs/braincollection.md",
      "development/specs/glm.md",
      "development/specs/ridge.md",
      "development/specs/ttest.md",
    ] },
    { "Internal modules" = [
      "api/backends.md",
      "api/cache.md",
      "api/utils.md",
      "api/templates.md",
      "api/algorithms/decoding.md",
      "api/algorithms/inference.md",
      { "BrainData internals" = [
        "api/data/braindata_io.md",
        "api/data/braindata_analysis.md",
        "api/data/braindata_modeling.md",
        "api/data/braindata_prediction.md",
        "api/data/braindata_bootstrap.md",
        "api/data/braindata_plotting.md",
      ] },
      { "Adjacency internals" = [
        "api/data/adjacency_stats.md",
        "api/data/adjacency_modeling.md",
        "api/data/adjacency_plotting.md",
        "api/data/adjacency_io.md",
      ] },
      { "DesignMatrix internals" = [
        "api/data/design_matrix_transforms.md",
        "api/data/design_matrix_regressors.md",
        "api/data/design_matrix_append.md",
        "api/data/design_matrix_diagnostics.md",
        "api/data/design_matrix_plotting.md",
        "api/data/design_matrix_io.md",
      ] },
    ] },
    "changelog.md",
  ] },
]

# Broken internal links fail `zensical build --strict`. Anchor checking stays off
# until the API pages are generated by mkdocstrings: griffe2md writes MyST
# `(label)=` targets, which Python-Markdown does not turn into heading anchors,
# so every cross-reference into docs/api/ currently reads as a dead anchor.
[project.validation]
invalid_links = true
invalid_link_anchors = false

[project.theme]
variant = "modern"
features = [
  "content.code.copy",
  "navigation.sections",
  "navigation.top",
  "search.suggest",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.snippets = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
