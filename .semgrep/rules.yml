# nltools structural lint — the semgrep half of the v0.6.0 API-convention gates.
#
# Division of labor (all wired into `poe lint-api`):
#   - scripts/check_api_vocabulary.py — the canonical-kwarg vocabulary (banned
#     alias kwargs + per-kwarg semantic contracts), driven by the machine-readable
#     manifest in docs/_data/api-vocabulary.yml. The banned-kwarg semgrep rules
#     that used to live here migrated there so the banned lists have one home.
#   - scripts/check_kwonly.py — the structural keyword-only `*`-marker check.
#   - THIS FILE — the checks semgrep's pattern language is genuinely better at:
#     result-dict KEY conventions and `**kwargs` in public signatures.
#
# Scope model: the conventions bind the PUBLIC API surface — the four data-class
# facades (BrainData, Adjacency, DesignMatrix, BrainCollection) plus the
# consolidated `nltools.algorithms` functions. Only the alignment subsystem may
# keep legacy names because the facades translate at their boundary (CLAUDE.md
# "Facade translation" rule). Rules therefore (a) match only public defs via the
# `^[^_]` name filter and (b) exclude alignment/pipeline internals by path.
#
# IMPORTANT (semgrep structure): the `metavariable-regex` name filter must be
# ANDed with `pattern-either` under a single `patterns:` block. A top-level
# `metavariable-regex` sibling to `pattern-either` is silently ignored by
# semgrep, so the `^[^_]` underscore exemption only takes effect when nested
# this way. (Verified 2026-07-17 — the flat form flagged `_private` helpers.)
#
# Suppress a genuine false positive with a `# nosemgrep: <rule-id>` trailing
# comment ON THE `def` LINE and a one-line reason (semgrep ignores suppressions
# that ruff wraps onto a continuation line).

rules:
  # ── Result-dict key: observed correlation must be `'correlation'` ──────────
  # A return-value convention (not a kwarg one), so this rule is NOT path-scoped
  # to public defs — result dicts are built in the algorithm layer, and the
  # convention binds every layer that emits a correlation result. The canonical
  # keys are `'correlation'` (observed correlation) + `'p'` + `'device'`,
  # matching correlation_permutation_test / matrix_permutation_test and the
  # `Adjacency.similarity` contract. The banned alias is `'r'` (which drifted
  # into docstrings; the code was already consistent — this keeps it that way).
  # Distance correlation is the documented exception: it uses `'dcorr'`.
  # The device field is `'device'` (renamed from `'parallel'` in v0.6.0);
  # `'backend'` is intentionally NOT
  # banned because the backends layer legitimately reports a backend *name*
  # (e.g. 'torch-cuda') under that key — a distinct concept from the selector.
  - id: banned-result-key-correlation
    languages: [python]
    severity: ERROR
    message: >-
      Result dict uses the key `'r'` for an observed correlation. The canonical
      key is `'correlation'` (matching correlation_permutation_test /
      matrix_permutation_test and the Adjacency.similarity contract). Rename it
      to `'correlation'`. Distance correlation is the exception and uses
      `'dcorr'`. If this `'r'` is genuinely unrelated to a correlation result,
      suppress with `# nosemgrep: banned-result-key-correlation` and a reason.
    patterns:
      - pattern: '{..., "r": $V, ...}'
    paths:
      exclude:
        - "**/tests/**"
        - "scripts/"
        - "nltools/plotting/"
        - "**/plotting.py"

  # ── **kwargs across internal nltools->nltools boundaries ───────────────────
  # Plotting modules are excluded: they overwhelmingly forward **kwargs to
  # matplotlib / seaborn / nilearn (legitimate third-party passthrough), so a
  # blanket flag there is pure noise. The genuine plotting misuses (mining
  # kwargs.get instead of forwarding — F128 plot_silhouette, F035 plot_mds) are
  # tracked as targeted api-consistency findings, not by this rule.
  - id: kwargs-internal-forwarding
    languages: [python]
    severity: WARNING
    message: >-
      `**kwargs` in a public signature. CLAUDE.md permits `**kwargs` ONLY when
      forwarding to a genuine third-party API (sklearn / matplotlib / nilearn /
      nibabel / seaborn / pandas). Internal nltools->nltools delegation must use
      explicit parameters. If this forwards to a third-party API, suppress with
      `# nosemgrep: kwargs-internal-forwarding` and name the API.
    patterns:
      - pattern-either:
          - pattern: "def $F(..., **kwargs): ..."
          - pattern: "def $F(..., **kwargs) -> $R: ..."
      - metavariable-regex:
          metavariable: $F
          regex: '^[^_]'
      # _NullProgressBar (nltools/utils.py) is the no-op tqdm stand-in: its
      # set_postfix/set_description mirror tqdm's own signatures so call sites
      # need no branching — a legitimate third-party-shaped surface, exempted
      # here (the manifest/config is the single home for suppressions; no
      # inline nosemgrep comments).
      - pattern-not-inside: |
          class _NullProgressBar:
              ...
    paths:
      exclude:
        - "**/tests/**"
        - "nltools/algorithms/alignment/"
        - "nltools/pipelines/"
        - "scripts/"
        # Plotting = legitimate matplotlib/seaborn/nilearn passthrough (see note above)
        - "nltools/plotting/"
        - "**/plotting.py"
        - "**/brain.py"
