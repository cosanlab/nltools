version: 1
project:
  title: nltools
  authors:
    - name: Luke J. Chang
    - name: Eshin Jolly
  github: cosanlab/nltools
  # Notebook-execution settings (read by MyST-NB): drop the stray matplotlib repr
  # strings (e.g. `Text(0.5, 1.0, …)`, `<Axes: …>`) that plotting cells leave as
  # text output when their last expression isn't silenced.
  settings:
    output_matplotlib_strings: remove
    # stderr policy (issue #489): tutorial cells must not *trigger* warnings — fix
    # the analysis, never filter the warning. `remove-warn` deletes every
    # `stream/stderr` output from the rendered page and logs one build warning per
    # removal with the text, so nothing leaks silently; raised exceptions are a
    # separate output type and are untouched (they fail the build under
    # `--strict`). scripts/check_tutorial_stderr.py reads the raw execute cache
    # and fails `docs-site` on any stderr. Once the count stays at zero, switch
    # this to `error` so MyST itself fails the build.
    output_stderr: remove-warn
  plugins:
    # Undo linkify's dead links on dotted identifiers (`BrainData.fit` -> http://BrainData.fit).
    - plugins/unlinkify.mjs
  toc:
    - file: index.md
    - file: migration-guide.md
      title: Migrating from v0.5
    - file: tutorials/index.md
      children:
        - title: Basics
          children:
            # Tutorial pages: MyST-NB markdown auto-generated from the marimo .py
            # notebooks by scripts/marimo_to_myst.py (run in docs-generate) and
            # executed at build time (--execute) to bake outputs.
            - file: tutorials/basics/01_brain_data.md
            - file: tutorials/basics/02_design_matrix.md
            - file: tutorials/basics/03_adjacency.md
            - file: tutorials/basics/04_brain_collection.md
        - title: Workflows
          children:
            - file: tutorials/workflows/01_glm.md
            - file: tutorials/workflows/02_encoding.md
            - file: tutorials/workflows/03_mvpa.md
            - file: tutorials/workflows/04_isc.md
    # User Guide — hand-written task pages, to be added here (between Tutorials
    # and Reference) once they exist under docs/guide/. mystmd errors on a TOC
    # entry whose file is missing, so the block is left out until then. Intended
    # shape (one page per task, mirroring the "Functions by task" reference
    # pages below; slugs are the guide author's call):
    #   - title: User Guide
    #     children:
    #       - file: guide/index.md
    #       - file: guide/<task>.md          # loading, glm, prediction, rsa, isc, alignment, plotting, ...
    #       - file: performance.md           # moves here from Development, title "Performance & GPU"
    # The API reference: pages are generated by scripts/build_api_docs.py from
    # its PAGES registry (a test keeps the two in sync). Task pages under
    # api/tasks/ re-cut the public functions by what a user wants to do; the
    # per-module reference sits last, under Development > Internal modules.
    - title: Reference
      children:
        - title: Data classes
          children:
            - file: api/data/brain_data.md
            - file: api/data/adjacency.md
            - file: api/data/design_matrix.md
            - file: api/data/brain_collection.md
            - file: api/data/fitresults.md
              title: Fit & Predict results
            - file: api/models.md
        - title: Functions by task
          children:
            - file: api/tasks/loading.md
            - file: api/tasks/preprocessing.md
            - file: api/tasks/design-and-glm.md
            - file: api/tasks/prediction.md
            - file: api/tasks/similarity.md
            - file: api/tasks/alignment.md
            - file: api/tasks/inference.md
            - file: api/tasks/intersubject.md
            - file: api/tasks/plotting.md
            - file: api/tasks/atlases.md
            - file: api/tasks/simulation.md
        - file: api/algorithms.md
          title: nltools.algorithms (A–Z index)
    - title: Development
      children:
        - file: contributing.md
        - file: development/index.md
          title: Architecture
        # Standalone interactive HTML page (copied into _build/html by the
        # docs-site task). Literal URL; docs-site's perl rewrite prefixes
        # BASE_URL on a subpath deploy (nltools.org is a root deploy).
        - title: Design Tour
          url: /design-tour.html
        - file: development/execution-model.md
        - file: development/ridge-internals.md
        - file: development/inference-internals.md
        - file: performance.md
          title: Performance & GPU
        - title: Internal modules
          children:
            - file: api/backends.md
            - file: api/cache.md
            - file: api/neighborhoods.md
            - file: api/utils.md
            - file: api/templates.md
            - file: api/algorithms/ridge.md
            - file: api/algorithms/inference.md
            - title: BrainData internals
              children:
                - file: api/data/braindata_io.md
                - file: api/data/braindata_analysis.md
                - file: api/data/braindata_modeling.md
                - file: api/data/braindata_prediction.md
                - file: api/data/braindata_bootstrap.md
                - file: api/data/braindata_plotting.md
            - title: Adjacency internals
              children:
                - file: api/data/adjacency_stats.md
                - file: api/data/adjacency_modeling.md
                - file: api/data/adjacency_plotting.md
                - file: api/data/adjacency_io.md
                - file: api/data/adjacency_spatial.md
            - title: DesignMatrix internals
              children:
                - file: api/data/design_matrix_transforms.md
                - file: api/data/design_matrix_regressors.md
                - file: api/data/design_matrix_append.md
                - file: api/data/design_matrix_diagnostics.md
                - file: api/data/design_matrix_plotting.md
                - file: api/data/design_matrix_io.md
            - title: BrainCollection internals
              children:
                - file: api/data/collection_core.md
                - file: api/data/collection_execution.md
                - file: api/data/collection_inference.md
                - file: api/data/collection_io.md
        - file: changelog.md
site:
  # No `domains:` entry — mystmd rejects apex domains (it requires >= 3 dot-parts,
  # e.g. `docs.example.org`). The static build stamps its localhost dev-server host
  # into sitemap.xml/robots.txt/page metadata instead; the docs-site task rewrites
  # it to SITE_URL (default https://nltools.org).
  options:
    logo: ''
    logo_text: nltools
    favicon: ./logo.png
    style: ./_static/custom.css
    folders: true
  template: book-theme
