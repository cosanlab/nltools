# Canonical v0.6.0 kwarg vocabulary — SINGLE SOURCE OF TRUTH.
# DesignMatrix contract (Kata kjtp): existing keyword names/defaults are retained.
# Constructor-only pandas ingress and removal of its dedicated to_pandas method
# change supported operations, not the keyword vocabulary. Direct Polars kwargs
# continue to belong to the third-party API; see development/specs/designmatrix.md.
#
# This file is the machine-readable source for the canonical-kwarg vocabulary. It
# feeds TWO consumers, both wired into `poe lint-api`:
#
#   1. Docs rendering — `scripts/build_api_vocabulary.py` injects rendered tables into
#      docs/development/index.md (2-column prose table) and docs/public/design-tour.html
#      (3-column table + "exceptions" callout) between `<!-- AUTOGEN:api-vocabulary -->`
#      marker pairs. Edit HERE, then `uv run poe docs-generate` to propagate; the
#      `--check` mode fails CI if the committed tables have drifted.
#   2. Code enforcement — `scripts/check_api_vocabulary.py` walks every public `def`
#      in nltools/ with `ast` and validates signatures against the `enforcement:`
#      section below: banned alias kwargs and per-kwarg semantic contracts (e.g.
#      `metric=` may never default to a central tendency — that concept is `summary=`).
#
# This file IS the canon: CLAUDE.md's "API Conventions" section, the rendered docs
# tables, and the enforcement scripts all point here. There is no second copy to
# keep in sync — edit the vocabulary/rules here and regenerate.
#
# Per-row fields:
#   concept    — the concept the kwarg names (shared by both tables).
#   kwarg      — the bare canonical name; the design-tour "Canonical kwarg" cell
#                renders it as <code>{kwarg}</code>.
#   tour_note  — the design-tour "Notes" cell, written in Markdown. Inline
#                `code` spans and *emphasis* are converted to HTML; `·` chips are
#                literal. Used only by the design tour.
#   index_md   — the index.md "Canonical kwarg" cell, written as raw Markdown
#                (e.g. a `code` span, possibly with a value set or qualifier).
#                Table pipes are escaped automatically at render time — author
#                them as plain `|`.

stats:
  data_classes: 4
  algorithm_families: 3
  compute_backends: 2

vocabulary:
  - concept: "Algorithm / variant choice"
    kwarg: "method"
    tour_note: "not `algorithm`/`scheme`/`kind`"
    index_md: "`method`"
  - concept: "Decoding estimator (MVPA)"
    kwarg: "estimator"
    tour_note: "an sklearn *object* or a shortcut name — `method` names an algorithm variant"
    index_md: "`estimator: str | BaseEstimator = 'linear_svc'` on `BrainData.predict` — a built-in shortcut name or any sklearn estimator / `Pipeline`. It names an sklearn object, so it is distinct from `method=`, which selects an algorithm variant"
  - concept: "Spatial scale"
    kwarg: "spatial_scale"
    tour_note: "`'whole_brain'` · `'roi'` · `'searchlight'`"
    index_md: "`spatial_scale` (`'whole_brain' | 'roi' | 'searchlight'`)"
  - concept: "Distance / similarity metric"
    kwarg: "metric"
    tour_note: "kept separate from `method`"
    index_md: "`metric`"
  - concept: "Central tendency"
    kwarg: "summary"
    tour_note: "`'mean'` · `'median'` — never `metric`"
    index_md: "`summary` (`'mean' | 'median'`)"
  - concept: "Cross-validation spec"
    kwarg: "cv"
    tour_note: "`None` = deterministic 5-fold · `int` folds · sklearn splitter — `'loo'`/`'logo'` are `resolve_cv`-only"
    index_md: "`cv` (`int |` splitter `| None`) on `BrainData.predict` — `None` is a deterministic five-fold `KFold`/`StratifiedKFold`; the `'loo'`/`'logo'` names are accepted only by `resolve_cv`, and `'loso'`/`'loro'` are gone everywhere. The grouping lives in `groups=`"
  - concept: "Subject-level parallelism"
    kwarg: "n_jobs"
    tour_note: "default `-1`"
    index_md: "`n_jobs: int = -1`"
  - concept: "GPU / CPU selection"
    kwarg: "device"
    tour_note: "orthogonal to `n_jobs` — explicit `'gpu'` runs or raises"
    index_md: "`device: str = \"cpu\"` — run-or-raise: explicit `'gpu'` never silently degrades to CPU; `'auto'` is the one graceful-fallback path"
  - concept: "Backend (alignment internals)"
    kwarg: "parallel"
    tour_note: "`None` · `'cpu'` · `'gpu'` — inference and ridge use `device`"
    index_md: "`parallel: None | 'cpu' | 'gpu'` (the inference engine and `Ridge` use `device` as of v0.6.0)"
  - concept: "Working-memory budget"
    kwarg: "memory_budget_gb"
    tour_note: "device-neutral · `None` measures the device"
    index_md: "`memory_budget_gb: float | None = None` — device-neutral working-memory budget for internal batching; `None` measures the selected device with headroom"
  - concept: "Progress indicator"
    kwarg: "progress_bar"
    tour_note: "`verbose` reserved for log-level"
    index_md: "`progress_bar: bool = False`"
  - concept: "Permutation count"
    kwarg: "n_permute"
    tour_note: "distinct from…"
    index_md: "`n_permute`"
  - concept: "Bootstrap sample count"
    kwarg: "n_samples"
    tour_note: "…the bootstrap count"
    index_md: "`n_samples`"
  - concept: "Bootstrap statistic"
    kwarg: "statistic"
    tour_note: "a closed set of eight names — not `stat`, never a callable"
    index_md: "`statistic` on `bootstrap` — a closed set of eight names (`'mean'`, `'median'`, `'std'`, `'sum'`, `'min'`, `'max'`, `'weights'`, `'predict'`); no callables and no dynamic dispatch to other methods"
  - concept: "Interval confidence level"
    kwarg: "confidence_level"
    tour_note: "one level, not a percentile pair"
    index_md: "`confidence_level: float = 0.95` — one level in `(0, 1)`, not a `percentiles` pair; the reported bounds are the central percentile interval, elementwise marginal"
  - concept: "Retain resampled draws"
    kwarg: "return_samples"
    tour_note: "retention only — it never changes interval semantics"
    index_md: "`return_samples: bool = False` on `bootstrap` — keeps every replicate (bootstrap axis first); it changes retention only, never the interval"
  - concept: "Tail of test"
    kwarg: "tail"
    tour_note: "`2`/`'two'` default · `1`/`'one'` = the test's positive direction"
    index_md: "`tail` (`2 | 'two' | 1 | 'one'`; direction fixed by the test, never the data)"
  - concept: "Threshold pair"
    kwarg: "lower, upper, binarize"
    tour_note: "convenience `threshold` where bidirectional"
    index_md: "`lower`, `upper`, `binarize` (+ `threshold` where bidirectional)"
  - concept: "Display autoscaling"
    kwarg: "autoscale"
    tour_note: "`True` = robust percentile window · `False` = raw magnitude range"
    index_md: "`autoscale: bool = True` (viewer display window; `False` = raw magnitude range)"
  - concept: "Display symmetry"
    kwarg: "symmetric"
    tour_note: "`'auto'` = symmetric only for mixed-signed maps · `True` forces symmetry · `False` scales limbs independently"
    index_md: "`symmetric: bool | 'auto' = 'auto'` (viewer positive/negative limbs)"
  - concept: "Diagonal flag"
    kwarg: "include_diag"
    tour_note: "not `ignore_diagonal` — inverted sense"
    index_md: "`include_diag: bool`"
  - concept: "Radius (mm)"
    kwarg: "radius"
    tour_note: "`predict(radius=)` follows nilearn · `radius_mm` elsewhere keeps the units in the name"
    index_md: "`radius: float = 10.0` on `BrainData.predict` (millimeters, matching nilearn's searchlight); the other searchlight and surface entry points keep `radius_mm`"
  - concept: "GLM-specific fit option"
    kwarg: "glm_*"
    tour_note: "`glm_noise_model` · `glm_bins` · `glm_n_jobs` — `random_state` stays bare"
    index_md: "`glm_*` on `BrainData.fit` (`glm_noise_model`, `glm_bins`, `glm_n_jobs`) — a non-default one under `model='ridge'` raises `ValueError`; `random_state` keeps its bare name because both estimators use it"
  - concept: "Ridge-specific fit option"
    kwarg: "ridge_*"
    tour_note: "`ridge_alpha` · `ridge_cv` · `ridge_device` · … — `random_state` stays bare"
    index_md: "`ridge_*` on `BrainData.fit` (`ridge_alpha`, `ridge_cv`, `ridge_search_iterations`, `ridge_dirichlet_concentration`, `ridge_device`, `ridge_memory_budget_gb`, `ridge_per_target_alpha`, `ridge_prefer_conservative_alpha`, `ridge_progress_bar`) — each maps onto the identically-named `Ridge` argument, and a non-default one under `model='glm'` raises `ValueError`"
  - concept: "Contrast inference toggle"
    kwarg: "inference"
    tour_note: "`False` returns the effect · `True` returns a `ContrastResult`"
    index_md: "`inference: bool = False` on `compute_contrasts` — the effect alone by default (what a second-level model consumes); `True` returns the full `ContrastResult`"

# Deliberate deviations from the table (design-tour "exceptions" callout).
# Each entry names the module `path` (prefix-matched, like exclude_paths),
# function, and kwarg it exempts — the checker suppresses that exact
# (path, function, kwarg) triple, so a same-named def elsewhere is still
# checked — and carries `text`, the Markdown → HTML sentence the design tour
# renders. Keep in sync with CLAUDE.md exceptions F175/F105/F077.
exceptions:
  - path: "nltools/data/braindata/__init__.py"
    function: "BrainData.fit"
    kwarg: "model"
    finding: F175
    text: "`fit(model='glm'|'ridge')` selects an estimator *class*, not a variant."
  - path: "nltools/models/glm.py"
    function: "Glm.compute_contrasts"
    kwarg: "tail"
    finding: tails-sweep
    text: "GLM contrast p-values are *one-sided* (the nilearn/SPM directional-contrast convention) and take no `tail=` knob — the one deliberate exception to the two-tailed default."
  - path: "nltools/data/braindata/__init__.py"
    function: "BrainData.bootstrap"
    kwarg: "tail"
    finding: tails-sweep
    text: "`BrainData.bootstrap` and `Adjacency.bootstrap` report a percentile confidence interval and no p-value, so they take no `tail=` knob — a deliberate carve-out from the tails sweep, not an omission."

# ── Machine-checkable enforcement rules (scripts/check_api_vocabulary.py) ─────
#
# Scope model mirrors .semgrep/rules.yml: rules bind PUBLIC (non-underscore)
# defs; the alignment/pipelines subsystems keep legacy names because the
# facades translate at their boundary (CLAUDE.md "Facade translation" rule).
#
#   banned_kwargs   — alias → {canonical, exclude_paths?}: the alias may not
#                     appear as a parameter name on any public def in scope.
#   kwarg_contracts — canonical kwarg → constraints checked when the kwarg
#                     appears WITH a literal default: `banned_defaults` (values
#                     that signal the wrong concept), `allowed_defaults` (the
#                     closed set of legal defaults), `keyword_only: true`.
#   exemptions      — extra (path, function, kwarg) suppressions beyond
#                     `exceptions:` above (which the checker also honors).
#                     `path` is the defining module, prefix-matched like
#                     exclude_paths. Each needs a reason.
#   kwonly_exemptions — (path, function) suppressions for the keyword-only
#                     `*`-marker check (scripts/check_kwonly.py). Same path
#                     semantics; each needs a reason.
enforcement:
  exclude_paths:
    - "nltools/tests/"
    - "nltools/algorithms/alignment/"
    - "nltools/pipelines/"
  banned_kwargs:
    algorithm: {canonical: "method"}
    scheme: {canonical: "method"}
    kind: {canonical: "method"}
    estimator:
      canonical: "method (algorithm variant) — estimator= is canonical only on BrainData.predict, where it names an sklearn object"
    icc_type: {canonical: "method"}
    extract_type: {canonical: "method"}
    perm_type: {canonical: "method"}
    contrast_type: {canonical: "method"}
    mode: {canonical: "method"}
    parallel:
      canonical: "n_jobs (CPU workers) or device (cpu/gpu selection)"
      # resolve_backend() is the boundary translator from the alignment
      # layer's `parallel=` vocabulary to a Backend — its param IS the concept.
      exclude_paths: ["nltools/algorithms/backends.py"]
    backend:
      canonical: "device"
      # Home of the Backend abstraction itself — its `backend=` params ARE the concept.
      exclude_paths: ["nltools/algorithms/backends.py"]
    n_perm: {canonical: "n_permute"}
    n_iter: {canonical: "n_permute (permutations), n_samples (bootstrap), or search_iterations (banded ridge)"}
    alphas: {canonical: "alpha (a scalar fits it; a sequence selects among the candidates)"}
    concentration: {canonical: "dirichlet_concentration"}
    local_alpha: {canonical: "per_target_alpha"}
    conservative: {canonical: "prefer_conservative_alpha"}
    show_progress: {canonical: "progress_bar"}
    stat: {canonical: "statistic (the bootstrap statistic name)"}
    save_boots: {canonical: "return_samples"}
    save_weights: {canonical: "return_samples"}
    percentiles: {canonical: "confidence_level (one level, not a percentile pair)"}
    ignore_diagonal: {canonical: "include_diag (note the inverted sense)"}
  kwarg_contracts:
    metric:
      banned_defaults: ["mean", "median"]
      hint: "a 'mean'/'median' default means this is a central tendency — name it summary=; metric= is reserved for distance/similarity metrics"
    summary:
      allowed_defaults: ["mean", "median"]
      hint: "summary= is the 'mean'|'median' central-tendency choice; other concepts need another name (e.g. cluster_summary's within/between choice is scope=)"
    progress_bar:
      allowed_defaults: [false]
      keyword_only: true
      hint: "canonical form is `*, progress_bar: bool = False`"
    autoscale:
      allowed_defaults: [true]
      keyword_only: true
      hint: "canonical form is `*, autoscale: bool = True` — robust by default; False uses the raw magnitude range, never the default"
    symmetric:
      allowed_defaults: ["auto"]
      keyword_only: true
      hint: "canonical form is `*, symmetric: bool | 'auto' = 'auto'` — mixed-signed maps are symmetric by default; one-sided maps use their full range"
    n_jobs:
      allowed_defaults: [-1]
      hint: "canonical form is `n_jobs: int = -1` (all cores)"
    confidence_level:
      allowed_defaults: [0.95]
      keyword_only: true
      hint: "canonical form is `*, confidence_level: float = 0.95` — one level strictly inside (0, 1); a percentile pair is the banned `percentiles=` spelling"
    return_samples:
      allowed_defaults: [false]
      keyword_only: true
      hint: "canonical form is `*, return_samples: bool = False` — retention only; it must never change interval or estimate semantics"
    device:
      allowed_defaults: ["cpu", "auto"]
      hint: "canonical form is `device: str = 'cpu'` ('auto' where supported); run-or-raise — explicit 'gpu' either runs on the GPU or raises, never a silent CPU fallback ('auto' is the one graceful path)"
      # Backend's own methods use `device=None` to mean "the backend's device".
      exclude_paths: ["nltools/algorithms/backends.py"]
    memory_budget_gb:
      allowed_defaults: [null]
      keyword_only: true
      hint: "canonical form is `*, memory_budget_gb: float | None = None` — the device-neutral working-memory budget; None measures the selected device via backends.device_memory_budget, an explicit positive GB value is used verbatim"
    max_gpu_memory_gb:
      allowed_defaults: [null]
      hint: "canonical form is `max_gpu_memory_gb: float | None = None` — None measures the device via backends.device_memory_budget (batch sizing then caps the measured budget at the saturation ceiling); an explicit GB is used verbatim, uncapped"
    spatial_scale:
      allowed_defaults: ["whole_brain", "roi", "searchlight"]
      hint: "spatial_scale selector values are 'whole_brain' | 'roi' | 'searchlight'"
    tail:
      allowed_defaults: [2]
      hint: "canonical form is `tail: int | str = 2` — 2|'two' (two-tailed, the library default) or 1|'one' (one-tailed in the test's positive direction); sites where only one tail is statistically valid (dcorr, F, Rayleigh) take no tail kwarg at all"
  exemptions:
    # `stat=` is banned as a bootstrap-statistic alias. These three predate that
    # concept and name something else entirely.
    - {path: "nltools/algorithms/corrections.py", function: "threshold", kwarg: "stat", reason: "names the statistic map being thresholded, not a bootstrap statistic"}
    - {path: "nltools/data/braindata/__init__.py", function: "BrainData.plot", kwarg: "stat", reason: "names the timeseries plot's central tendency, not a bootstrap statistic"}
    - {path: "nltools/data/braindata/plotting.py", function: "plot_brain", kwarg: "stat", reason: "delegation target of BrainData.plot"}
    # BrainData.predict defaults n_jobs=1 to limit searchlight worker memory.
    - {path: "nltools/data/braindata/__init__.py", function: "BrainData.predict", kwarg: "n_jobs", reason: "searchlight worker memory; documented in the docstring"}
    - {path: "nltools/data/braindata/prediction.py", function: "predict", kwarg: "n_jobs", reason: "delegation target of BrainData.predict"}
    # MVPA's estimator= names an sklearn object, not an algorithm variant, so it
    # is canonical there while the alias stays banned everywhere else.
    - {path: "nltools/data/braindata/__init__.py", function: "BrainData.predict", kwarg: "estimator", reason: "names an sklearn estimator object, not an algorithm variant"}
    - {path: "nltools/data/braindata/prediction.py", function: "predict", kwarg: "estimator", reason: "delegation target of BrainData.predict"}
    - {path: "nltools/data/braindata/prediction.py", function: "predict_mvpa", kwarg: "estimator", reason: "delegation target of BrainData.predict"}
    - {path: "nltools/data/braindata/prediction.py", function: "resolve_estimator", kwarg: "estimator", reason: "resolves the estimator= argument of BrainData.predict"}
    - {path: "nltools/data/braindata/prediction.py", function: "build_pipeline", kwarg: "estimator", reason: "builds the pipeline for the estimator= argument of BrainData.predict"}
    # Only autoregressive fits reach nilearn's parallel path, so the default
    # OLS fit never spawns workers.
    - {path: "nltools/models/glm.py", function: "Glm.__init__", kwarg: "n_jobs", reason: "nilearn's run_glm parallelizes AR groups only; documented in the docstring"}
  # Keyword-only `*`-marker carve-outs (scripts/check_kwonly.py). These
  # functions deliberately mirror numpy signatures so they are drop-in
  # substitutes inside backend-generic code (numpy accepts
  # `np.zeros_like(a, dtype, order)` positionally); forcing a `*` here would
  # break that substitutability for no safety gain. Do NOT add entries to
  # escape the convention for ordinary nltools functions — this list exists
  # only for signatures whose shape is dictated by an external API.
  kwonly_exemptions:
    - {path: "nltools/algorithms/backends.py", function: "zeros_like", reason: "mirrors np.zeros_like"}
    - {path: "nltools/algorithms/backends.py", function: "ones_like", reason: "mirrors np.ones_like"}
    - {path: "nltools/algorithms/backends.py", function: "full_like", reason: "mirrors np.full_like"}
    - {path: "nltools/algorithms/backends.py", function: "assert_array_almost_equal", reason: "mirrors np.testing.assert_array_almost_equal"}
